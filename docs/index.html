<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saphal Book</title>
<meta name="description" content="Bookkeeping, accounting and audit for Nepal.">
<meta name="theme-color" content="#1d3557">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<style>
:root{
  --ink:#16202b; --soft:#4f5d6b; --faint:#8b98a5; --paper:#fff; --ground:#f2f5f8;
  --line:#dfe5ec; --brand:#1d3557; --brand-lift:#2f5b96; --brand-soft:#e7eefb;
  --brand-line:#bed0ec; --violet:#5546ad; --teal:#0d7d84; --amber:#a2670c;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#e8edf3; --soft:#a9b6c4; --faint:#74838f; --paper:#161c24; --ground:#0f141a;
  --line:#2a343f; --brand:#4d7ab8; --brand-lift:#5c8bcb; --brand-soft:#1c2a3d;
  --brand-line:#2f4258; --violet:#9d94e0; --teal:#4fb3b8; --amber:#d9a441;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--ground);color:var(--ink);
  line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh}
.rail{height:4px;flex:0 0 auto;
  background:linear-gradient(90deg,var(--brand) 0%,var(--violet) 30%,var(--teal) 60%,var(--amber) 85%,#a83a71 100%)}

main{flex:1 1 auto;display:grid;place-items:center;padding:2rem 1.2rem}
.panel{width:100%;max-width:430px;text-align:center}

.mark{width:86px;height:86px;border-radius:22px;
  box-shadow:0 10px 34px rgba(16,32,48,.18);margin:0 auto;display:block}
h1{font-size:2.05rem;margin:1.15rem 0 .35rem;letter-spacing:-.025em;font-weight:700}
.tag{color:var(--soft);font-size:1.02rem;margin:0 auto 2rem;max-width:24rem}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:1.5rem 1.4rem;box-shadow:0 1px 3px rgba(16,32,48,.05);text-align:left}
.card h2{font-size:1.05rem;margin:0 0 .25rem;letter-spacing:-.01em;font-weight:650}
.card p{margin:0 0 1.15rem;color:var(--soft);font-size:.9rem;line-height:1.55}

.btn{display:block;text-decoration:none;border-radius:10px;padding:.85rem 1.1rem;
  text-align:center;font-weight:650;font-size:.95rem;
  background:linear-gradient(165deg,var(--brand-lift),var(--brand));color:#fff;
  box-shadow:0 2px 9px rgba(20,40,66,.22);transition:filter .15s}
.btn:hover{filter:brightness(1.09)}
.btn.ghost{background:var(--paper);color:var(--brand-lift);
  border:1px solid var(--brand-line);box-shadow:none}
.btn.ghost:hover{background:var(--brand-soft);filter:none}
.btn + .btn{margin-top:.6rem}

.quiet{margin-top:1.6rem;font-size:.86rem;color:var(--faint);text-align:center}
.quiet a{color:var(--brand-lift);text-decoration:none;font-weight:600}
.quiet a:hover{text-decoration:underline}

footer{flex:0 0 auto;text-align:center;padding:1.4rem 1.2rem 2rem;
  font-size:.78rem;color:var(--faint)}
</style>
</head>
<body>
<div class="rail"></div>

<main>
  <div class="panel">
    <img class="mark" src="icon-192.png?v=2" alt="">
    <h1>Saphal Book</h1>
    <p class="tag">Bookkeeping, accounting and audit for Nepal.</p>

    <div class="card">
      <h2>Open your books</h2>
      <p>Sign in with the name you already use, or open a new set of books.
         Everything stays on your own device.</p>
      <a class="btn" href="app/">Sign in</a>
      <a class="btn ghost" href="app/">Create an account</a>
    </div>

    <p class="quiet">
      Using it on a computer, a phone or a tablet?
      <a href="install/">Install it</a>
    </p>
  </div>
</main>

<footer>Bikram Sambat &middot; VAT &middot; TDS &middot; NFRS</footer>
</body>
</html>
