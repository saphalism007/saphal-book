# Keeps the account server from going to sleep.
#
# The server is a free Supabase project, and a free project is paused after
# about a week without enough activity. A paused project is not slow, it is
# gone: its address stops existing, every device loses touch with the account,
# and a phone that has never been signed in to before cannot open at all.
#
# This used to only ask the sign in service whether it was up and knock on the
# books table, which turns it away. It ran twice a day for a month, every run
# green, and Supabase still wrote to say the project was going to be paused,
# because neither call made the database do any work.
#
# So now it calls keep_awake(), a function in the database (cloud/keep-awake.sql)
# that writes one timestamp and reads it back: a real query and a real write.
# The key is the public one already inside the app; that function is all it
# can reach here.
#
# If the call fails, the run fails on purpose, so it shows as a red cross and
# GitHub sends an email rather than it passing quietly.

name: Keep the account server awake

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Make the database do some work
        env:
          SERVER: https://oswbrodmrwprdydxvtmx.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zd2Jyb2RtcndwcmR5ZHh2dG14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTcwODksImV4cCI6MjEwNDA5MzA4OX0.MOY7Ipgd5tf8tmL1kaJCE5qcZ59Lw9jY2pMoocrlXqE
        run: |
          answer=$(curl -s -m 60 -w " HTTP %{http_code}" -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' \
            "$SERVER/rest/v1/rpc/keep_awake" || true)
          echo "keep_awake answered: $answer"
          case "$answer" in
            *"HTTP 200") echo "The database did its work. It stays awake." ;;
            *"HTTP 000")
              echo "The account server did not answer. It is probably paused."
              echo "Open supabase.com, choose the project and press Restore."
              exit 1 ;;
            *)
              echo "The server answered but keep_awake did not run."
              echo "Run cloud/keep-awake.sql once in the Supabase SQL Editor."
              exit 1 ;;
          esac
